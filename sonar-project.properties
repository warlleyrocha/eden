# Usar o nome do package.json
sonar.projectKey=web
sonar.projectName=Web
sonar.projectVersion=0.0.0
sonar.projectDescription=Análise de código do projeto Web

# Servidor SonarQube local
sonar.host.url=http://localhost:9000

# Código fonte
sonar.sources=src
sonar.sourceEncoding=UTF-8

# TypeScript específico
sonar.typescript.node=node
sonar.typescript.excludeTypeDefinitionFiles=true

# Exclusões
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,*.config.js,*.config.ts

# Configurações de qualidade
sonar.qualitygate.wait=true